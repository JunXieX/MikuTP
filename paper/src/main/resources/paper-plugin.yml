name: MikuTP
version: '${version}'
main: com.mikumc.mikutp.paper.MikuTPPlugin
api-version: '26.2'
authors: [JunXieX]
description: 多功能传送套件：家、地标、传送请求、随机传送与跨服传送（Paper/Folia）。MikuMC 服务器原创插件，作者 JunXieX，交流群 1105054380
folia-supported: true
loader: com.mikumc.mikutp.paper.MikuTPLoader

dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  mikutp.home:
    description: 使用 /home 与 /homes 回到自己的家
    default: true
  mikutp.home.set:
    description: 使用 /sethome 设置家
    default: true
  mikutp.home.delete:
    description: 使用 /delhome 删除家
    default: true
  mikutp.warp:
    description: 使用 /warp 前往服务器地标
    default: true
  mikutp.warp.manage:
    description: 使用 /setwarp 与 /delwarp 管理服务器地标
    default: op
  mikutp.tpa:
    description: 发起与应答传送请求（/tpa /tpahere 等）
    default: true
  mikutp.wild:
    description: 使用 /wild 随机传送
    default: true
  mikutp.back:
    description: 使用 /back 返回上次传送的位置
    default: true
  mikutp.dback:
    description: 使用 /dback 返回死亡地点
    default: true
  mikutp.otp:
    description: 使用 /otp 与 /otph 强制传送（管理员）
    default: op
  mikutp.admin:
    description: 使用 /mtp 管理命令（reload/resync/permissions/info）
    default: op
  mikutp.bypass.warmup:
    description: 免除传送预热等待
    default: false
  mikutp.bypass.cooldown:
    description: 免除传送冷却
    default: false
  mikutp.homes.unlimited:
    description: 不受家的数量上限限制
    default: false
